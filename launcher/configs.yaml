    - id: baseline72
      tagline: Original 250W baseline
      tier: legacy
      status: superseded
      bat: '${SNAPSHOTS_DIR}\start_72tps.bat'
      py:  '${SNAPSHOTS_DIR}\start.py'
      gpu: GPU1
      tp: 1
      pp: 1
      mem_util: 0.92
      mtp_n: 3
      ctx: 32000
      port: 5001
      decode_tps_long: 50
      decode_tps_short: 72.5
      power_cap_w: 250
      notes: Original 250W baseline. ~50 tok/s on 24k prompt; 72.5 on short prompts.

    - id: rtx5090_nvfp4
      tagline: 5090 NVFP4 default, full TDP prefill
      tier: active
      status: recommended
      arch: blackwell
      bat: '${SNAPSHOTS_DIR}\start_5090_nvfp4.bat'
      py:  '${SNAPSHOTS_DIR}\start_5090_nvfp4.py'
      gpu: GPU0
      tp: 1
      pp: 1
      mem_util: 0.95
      mtp_n: 6
      ctx: 200000
      port: 5001
      decode_tps: 91.9
      prefill_tps_cold: 5300
      power_cap_w: 575
      requires_wheel: 'vllm-0.20.0+cu132.devnen'
      vllm_version: 0.20.0+cu132.devnen.1
      notes: |
        Only RTX 5090 snapshot. NVFP4 weights route FFN/QKV/proj GEMMs
        through FlashInfer's sm_120 native FP4 tensor-core kernels
        (autotuned fp4_gemm), escaping the 170W prefill ceiling that
        AutoRound INT4 hits on consumer Blackwell (sm_120 GDN). AutoRound
        is still the path for Ampere/Ada (3090/4090); on the 5090 the
        prefill cap makes it too slow to ship, so the launcher only
        offers NVFP4 here. See docs/SM120_GDN_CEILING.md.

        Bench 2026-05-06 (cold unique-word prompts, no prefix cache hits):
          - 24k-prompt prefill : ~7,460 tok/s @ ~580W (vs ~1,100 AutoRound)
          - 47k-prompt prefill : ~5,300 tok/s @ ~584W (vs ~1,100 AutoRound)
          - decode (300 tok)   : ~92 tok/s (vs ~73 AutoRound)
          - peak SM%           : 100
          - peak mem-BW%       : 35 (vs 0 on AutoRound, silicon now in use)

        Validation 2026-05-06:
          - Coherence (3-tier short)              : PASS
          - Long-ctx coherence + needles
              50k / 100k / 177k tokens            : PASS at every depth
          - MTP acceptance @ 50k ctx              : 81.9% (4.91/6 avg)
          - MTP acceptance @ 150k ctx             : 73.9% (4.43/6 avg)
            (well above the 50% degraded-weight threshold)
          - Tool-calling (qwen3_coder + reasoning)
              + developer-role aliasing           : PASS all 3 tiers
          - HumanEval-style coding slice
              12/12 vs 12/12 tied with AutoRound
            (NB: this slice is SMALL — 12 problems, all of moderate
             difficulty. Tied 100% means we cannot resolve a small quality
             gap; doesn't prove parity at the long tail.)

        Model weights: Peutlefaire/Qwen3.6-27B-NVFP4 (HuggingFace, 20.6 GB).
        Default location: g:\_models\Qwen3.6-27B-NVFP4 — override with
        VLLM_NVFP4_MODEL_DIR.

        First-ever boot is slow (~9 min) because FlashInfer JIT-compiles
        the fp4_gemm kernels and profiles tactics for every unique GEMM
        shape in the model. The kernel binaries are cached under
        ~/.cache/flashinfer/; every subsequent boot still runs the
        autotune progress bars but finishes in ~1-2 min because only
        the tactic selection re-runs, the kernels are reused. The
        re-tune is unavoidable, treat it as part of normal startup.

        Note: FlashInfer logs "Skipped 6 unsupported tactic(s) for
        fp4_gemm" per shape. These are the sm_120a-suffixed tactics that
        would need TORCH_CUDA_ARCH_LIST=12.0a in the wheel build —
        currently the shipped wheel only has compute_120 (non-suffixed).
        Adding 12.0a in a future wheel rebuild may unlock more headroom.

        See docs/SM120_GDN_CEILING.md for the full investigation history.

    - id: rtx5090_nvfp4_vision
      tagline: 5090 NVFP4 + vision (image/video input) — 180k ctx
      tier: active
      status: experimental
      arch: blackwell
      bat: '${SNAPSHOTS_DIR}\start_5090_nvfp4_vision.bat'
      py:  '${SNAPSHOTS_DIR}\start_5090_nvfp4_vision.py'
      gpu: GPU0
      tp: 1
      pp: 1
      mem_util: 0.95
      mtp_n: 6
      ctx: 180000
      port: 5004
      decode_tps: null
      prefill_tps_cold: null
      power_cap_w: 575
      requires_wheel: 'vllm-0.20.0+cu132.devnen'
      vllm_version: 0.20.0+cu132.devnen.1
      vision_disabled: false
      mm_image_limit: 4
      mm_video_limit: 1
      notes: |
        Vision-enabled twin of rtx5090_nvfp4. Same Peutlefaire NVFP4 weights
        (Qwen3.6-27B-NVFP4) — that quant deliberately preserves the visual
        tower (the recipe excludes "re:visual.*" / "re:model.visual.*" from
        NVFP4 quantization), so the vision encoder is already on disk.
        Loading it is a flag flip, not a different model.

        VRAM cost vs the text twin:
          - Vision encoder weights resident on GPU: ~1.5-2.0 GiB BF16/F32
            (kept unquantized — only the LM body is NVFP4)
          - Each image consumes ~256-1280 visual tokens out of the KV pool
            depending on its resolution. A handful of high-res images
            can eat several thousand context tokens before the user's
            text prompt even starts.
          - FlashInfer also has to autotune additional GEMM shapes for
            the vision tower at first boot — expect 10-15 min cold warmup
            (vs ~9 min for the text-only NVFP4).

        Headroom strategy: ctx dropped 200k -> 180k vs the text twin to
        absorb the encoder + per-image KV cost while keeping mem_util at
        0.95. Measured at boot: KV pool = 66,912 tokens, max-concurrency
        1.22x at 180,000 tokens per request — comfortable headroom at
        max_num_seqs=1. If you OOM at boot:
          - lower CTX (open the editor with `e`) until vLLM's printed
            ceiling fits, OR
          - drop --limit-mm-per-prompt (currently image=4, video=1) to
            shrink the multimodal worst-case KV reservation.

        decode_tps / prefill_tps_cold: not yet benched. Expect decode
        comparable to the text twin (~92 tok/s) on text-only requests;
        per-image prefill adds vision-encoder forward time on top.

        Status is `experimental` until coherence + a multimodal smoke
        test pass. Same MTP n=6 spec-decode setup as the text twin;
        coherence harness still applies, plus a manual image-input
        smoke (POST /v1/chat/completions with an image_url content
        part).

        Requires the Blackwell zip + driver 596+. Same NVFP4 model dir
        as rtx5090_nvfp4 (override via VLLM_NVFP4_MODEL_DIR).

    - id: draft
      tagline: BLOCKED — no vocab=248320 drafter
      tier: blocked
      status: blocked
      bat: '${SNAPSHOTS_DIR}\start_draft.bat'
      py:  '${SNAPSHOTS_DIR}\start_draft.py'
      gpu: GPU1
      tp: 1
      pp: 1
      mem_util: 0.92
      draft_model_n: 5
      ctx: 32000
      port: 5003
      decode_tps: null
      prefill_tps_cold: null
      notes: |
        Draft-model speculative decode. BLOCKED — no compatible drafter
        with vocab_size=248320 exists for Qwen3.6-27B-int4-AutoRound.

  mtp_sweep:
    description: MTP n × ctx sweep on speed config (GPU1, mem=0.948, 350W)
    rows:
      - { mtp_n: 3, ctx: 121000, decode_tps: 50.7 }
      - { mtp_n: 3, ctx: 127000, decode_tps: 53.4 }
      - { mtp_n: 4, ctx: 120000, decode_tps: 58.3 }
      - { mtp_n: 5, ctx: 110000, decode_tps: 62.8 }
      - { mtp_n: 6, ctx: 90000,  decode_tps: 64.5, peak: true }
      - { mtp_n: 6, ctx: 100000, decode_tps: 64.4 }
      - { mtp_n: 6, ctx: 112000, decode_tps: 60.4 }
      - { mtp_n: 7, ctx: 90000,  decode_tps: 61.5 }
      - { mtp_n: 8, ctx: 90000,  decode_tps: 58.0 }

  compatibility_matrix:
    - { combo: 'TP=1 + MTP',           status: ok,      note: 'Works — production path' }
    - { combo: 'TP=1 + draft-model',   status: blocked, note: 'No compatible drafter (vocab=248320)' }
    - { combo: 'PP=2 + MTP',           status: bad,     note: 'Qwen3NextMTP does not inherit SupportsPP' }
    - { combo: 'PP=2 + ngram',         status: warn,    note: 'Boots, asserts on first request' }
    - { combo: 'PP=2 + no spec-decode', status: ok,     note: 'pp2_160k path' }
    - { combo: 'TP=2 (any)',           status: warn,    note: '~7.5 tok/s, unusable' }
    - { combo: 'Blackwell sm_120 + Marlin AutoRound INT4', status: warn, note: 'Boots and runs but FFN GEMMs hit the 170W sm_120 GDN prefill ceiling (~1.1k tok/s prefill). Use NVFP4 on 5090 instead. AutoRound stays the Ampere/Ada path.' }
    - { combo: 'Blackwell sm_120 + NVFP4',                 status: ok,   note: 'Verified on RTX 5090 / vLLM 0.20.0+cu132.devnen.1, native fp4_gemm tensor cores' }
    - { combo: 'Blackwell + cu126 wheel',  status: blocked, note: 'cudaErrorNoKernelImageForDevice — use blackwell zip' }
    - { combo: 'Ampere/Ada + cu130 wheel', status: warn,    note: 'Boots if driver >=596 installed; not the recommended path' }


