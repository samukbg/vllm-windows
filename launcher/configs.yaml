    - id: ctx64k
      tagline: Legacy ctx ladder
      tier: legacy
      status: superseded
      bat: '${SNAPSHOTS_DIR}\start_64k.bat'
      py:  '${SNAPSHOTS_DIR}\start_64k.py'
      gpu: GPU1
      tp: 1
      pp: 1
      mem_util: 0.94
      mtp_n: 3
      ctx: 64000
      port: 5001
      decode_tps: null
