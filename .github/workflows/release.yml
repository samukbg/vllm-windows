name: Release portable launcher

# Triggers:
#   - push of a tag matching v* -> auto-release.
#   - workflow_dispatch -> Run workflow from the Actions UI.
#
# The job:
#   - Pulls the latest devnen/vllm-windows wheel from its GitHub
#     Release (or a specific URL via dispatch input).
#   - Builds the portable launcher zip via windows_tools/build_launcher_zip.py
#     with --wheel pointing at the downloaded wheel.
#   - Computes SHA256SUMS.txt.
#   - Creates a GitHub Release with the zip + sums attached. Notes are
#     read from dist/RELEASE_NOTES.md when present.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to create/release against (e.g. v0.1.1). Required for workflow_dispatch.'
        required: false
        type: string
      wheel_url:
        description: 'Override URL to a specific patched vllm wheel. Defaults to latest from devnen/vllm-windows.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve release tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            REL="${GITHUB_REF#refs/tags/}"
          else
            REL="${{ inputs.release_tag }}"
            if [ -z "$REL" ]; then
              echo "::error::release_tag input is required for workflow_dispatch"; exit 1
            fi
          fi
          echo "release_tag=$REL" >> "$GITHUB_OUTPUT"

      - name: Resolve wheel URLs (Ampere + Blackwell)
        id: wheel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WHEEL_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          override='${{ inputs.wheel_url }}'
          # Pull every .whl asset from devnen/vllm-windows latest release;
          # split into the cu126 (0.19.x → Ampere/Ada) and cu13x (0.20.x →
          # Blackwell) variants by local-version tag in the filename.
          if [ -n "$override" ]; then
            URL_AMPERE="$override"
            NAME_AMPERE=$(basename "${URL_AMPERE%%\?*}")
            URL_BLACKWELL=""
            NAME_BLACKWELL=""
          else
            ASSETS_JSON=$(gh release view --repo devnen/vllm-windows --json assets)
            # Ampere/Ada: 0.19.x wheel, no +cu13 tag.
            URL_AMPERE=$(echo "$ASSETS_JSON" | jq -r '.assets[] | select(.name|endswith(".whl")) | select(.name|test("\\+cu13")|not) | .url' | head -n1)
            NAME_AMPERE=$(echo "$ASSETS_JSON" | jq -r '.assets[] | select(.name|endswith(".whl")) | select(.name|test("\\+cu13")|not) | .name' | head -n1)
            # Blackwell: 0.20.x wheel with +cu13 tag.
            URL_BLACKWELL=$(echo "$ASSETS_JSON" | jq -r '.assets[] | select(.name|endswith(".whl")) | select(.name|test("\\+cu13")) | .url' | head -n1)
            NAME_BLACKWELL=$(echo "$ASSETS_JSON" | jq -r '.assets[] | select(.name|endswith(".whl")) | select(.name|test("\\+cu13")) | .name' | head -n1)
          fi
          # Both wheels are mandatory unless a manual --wheel_url override was given
          # (override is single-variant Ampere by design). Releases must ship BOTH
          # zips, historically the Blackwell zip was uploaded by hand and CI
          # silently produced Ampere-only when the cu13 wheel went missing
          # upstream (see v1.2.2 incident). Fail loudly instead.
          if [ -n "$override" ]; then
            if [ -z "$URL_AMPERE" ]; then
              echo "::error::wheel_url override resolved to empty Ampere URL."
              exit 1
            fi
          else
            missing=()
            [ -z "$URL_AMPERE" ]    && missing+=("Ampere (cu126, no +cu13 tag)")
            [ -z "$URL_BLACKWELL" ] && missing+=("Blackwell (cu13x, +cu13 tag)")
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error::Required vLLM wheel(s) not found in devnen/vllm-windows latest release: ${missing[*]}"
              echo "::error::Upload the missing wheel to that release before tagging, or rerun with workflow_dispatch + wheel_url for an Ampere-only emergency build."
              exit 1
            fi
          fi
          echo "url_ampere=$URL_AMPERE"       >> "$GITHUB_OUTPUT"
          echo "name_ampere=$NAME_AMPERE"     >> "$GITHUB_OUTPUT"
          echo "url_blackwell=$URL_BLACKWELL" >> "$GITHUB_OUTPUT"
          echo "name_blackwell=$NAME_BLACKWELL" >> "$GITHUB_OUTPUT"
          echo "Ampere wheel:    ${NAME_AMPERE:-<none>}"
          echo "Blackwell wheel: ${NAME_BLACKWELL:-<none>}"

      - name: Download wheels
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WHEEL_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fetch() {
            local url="$1" name="$2"
            [ -z "$url" ] && return 0
            if [[ "$url" == https://api.github.com/* ]]; then
              gh api "$url" -H "Accept: application/octet-stream" > "$name"
            else
              curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$url" -o "$name"
            fi
            ls -lh "$name"
          }
          fetch '${{ steps.wheel.outputs.url_ampere }}'    '${{ steps.wheel.outputs.name_ampere }}'
          fetch '${{ steps.wheel.outputs.url_blackwell }}' '${{ steps.wheel.outputs.name_blackwell }}'

      - name: Build Ampere portable zip
        if: steps.wheel.outputs.name_ampere != ''
        shell: bash
        run: |
          python windows_tools/build_launcher_zip.py \
            --variant ampere \
            --wheel '${{ steps.wheel.outputs.name_ampere }}'

      - name: Build Blackwell portable zip
        if: steps.wheel.outputs.name_blackwell != ''
        shell: bash
        run: |
          python windows_tools/build_launcher_zip.py \
            --variant blackwell \
            --wheel '${{ steps.wheel.outputs.name_blackwell }}'

      - name: Create legacy Ampere alias (portable-x64.zip)
        if: steps.wheel.outputs.name_ampere != ''
        shell: bash
        run: |
          # v1.2.0/v1.2.1 update.py only knows the unsuffixed portable-x64.zip
          # name for Ampere. Keep an alias copy so users on those versions can
          # still auto-update past v1.2.2. The launcher repo's own updater
          # (v1.2.3+) prefers the -ampere.zip name and falls back to legacy.
          cp dist/qwen3.6-windows-server-portable-x64-ampere.zip \
             dist/qwen3.6-windows-server-portable-x64.zip
          ls -lh dist/*.zip

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd dist
          python -c "
          import hashlib, pathlib
          for p in sorted(pathlib.Path('.').glob('*.zip')):
              print(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}')
          " > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify both zips were built (push-tag mode)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -f dist/qwen3.6-windows-server-portable-x64-ampere.zip ]    || missing+=("ampere")
          [ -f dist/qwen3.6-windows-server-portable-x64-blackwell.zip ] || missing+=("blackwell")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Tag-driven release is missing zip variant(s): ${missing[*]}"
            exit 1
          fi
          echo "Both portable zips built:"
          ls -lh dist/*.zip

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          # Resolution order:
          #   1. release_notes/<tag>.md  -- hand-written per-release notes
          #      committed to the repo. This is the preferred path; commit
          #      the file alongside the fix that the tag ships.
          #   2. dist/RELEASE_NOTES.md   -- legacy path (dist/ is gitignored,
          #      so this only fires when something else in the build wrote
          #      it). Kept for backwards compatibility.
          #   3. Auto-generated from commits since the previous tag.
          REL='${{ steps.vars.outputs.release_tag }}'
          if [ -f "release_notes/${REL}.md" ]; then
            echo "path=release_notes/${REL}.md" >> "$GITHUB_OUTPUT"
            echo "mode=file" >> "$GITHUB_OUTPUT"
            echo "Using release_notes/${REL}.md"
          elif [ -f dist/RELEASE_NOTES.md ]; then
            echo "path=dist/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
            echo "mode=file" >> "$GITHUB_OUTPUT"
            echo "Using dist/RELEASE_NOTES.md (legacy path)"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "No release_notes/${REL}.md found - falling back to gh --generate-notes"
          fi

      - name: Create / update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REL='${{ steps.vars.outputs.release_tag }}'
          MODE='${{ steps.notes.outputs.mode }}'
          NOTES_PATH='${{ steps.notes.outputs.path }}'
          if ! git rev-parse "refs/tags/$REL" >/dev/null 2>&1; then
            git tag "$REL"
            git push origin "$REL" || true
          fi

          # gh release edit doesn't support --generate-notes, only create
          # does. For the edit branch with mode=auto, render notes via the
          # GH API release-notes generator and write to a temp file.
          if [ "$MODE" = "auto" ]; then
            AUTO_NOTES=/tmp/auto_notes.md
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$REL" \
              --jq '.body' > "$AUTO_NOTES"
            NOTES_ARGS=( --notes-file "$AUTO_NOTES" )
          else
            NOTES_ARGS=( --notes-file "$NOTES_PATH" )
          fi

          if gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$REL" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit   "$REL" "${NOTES_ARGS[@]}" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$REL" \
              --repo "$GITHUB_REPOSITORY" \
              --title "qwen3.6-windows-server $REL, portable Windows launcher" \
              "${NOTES_ARGS[@]}" \
              dist/*.zip dist/SHA256SUMS.txt
          fi
